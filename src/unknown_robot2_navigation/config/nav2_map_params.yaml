amcl:
  ros__parameters:
    use_sim_time: true

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan

    min_particles: 500
    max_particles: 2000
    kld_err: 0.05
    kld_z: 0.99

    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1

    transform_tolerance: 1.0
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.1
    max_beams: 60

    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0


map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""


map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65


bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom

    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000


controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3
    odom_topic: /odom

    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.0873

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true

      min_vel_x: 0.0
      max_vel_x: 0.25
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.70

      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0

      acc_lim_x: 0.35
      acc_lim_y: 0.0
      acc_lim_theta: 0.9

      decel_lim_x: -0.35
      decel_lim_y: 0.0
      decel_lim_theta: -0.9

      vx_samples: 24
      vy_samples: 1
      vtheta_samples: 56

      sim_time: 1.5
      linear_granularity: 0.025
      angular_granularity: 0.015
      transform_tolerance: 0.3

      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      BaseObstacle.scale: 0.30

      PathAlign.scale: 40.0
      PathAlign.forward_point_distance: 0.20

      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.20

      PathDist.scale: 48.0
      GoalDist.scale: 16.0

      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 10.0
      publish_frequency: 5.0

      global_frame: odom
      robot_base_frame: base_footprint

      # Robot size:
      # length = 0.54 m
      # width  = 0.34 m
      # Use footprint only. Do not add robot_radius.
      footprint: "[[0.27, 0.17], [0.27, -0.17], [-0.27, -0.17], [-0.27, 0.17]]"
      footprint_padding: 0.05

      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05

      transform_tolerance: 0.3

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.0
        inflation_radius: 0.35

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_footprint

      # Global costmap is more conservative than local costmap.
      # This makes the global planner avoid narrow corridors.
      footprint: "[[0.27, 0.17], [0.27, -0.17], [-0.27, -0.17], [-0.27, 0.17]]"
      footprint_padding: 0.08

      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.5

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer

        # Increase this if global planner still goes through narrow gap.
        cost_scaling_factor: 1.0
        inflation_radius: 0.55

      always_send_full_costmap: true


planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"

      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: false

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0

      # Higher value makes planner prefer lower-cost, safer cells
      cost_travel_multiplier: 2.5

      use_final_approach_orientation: false


smoother_server:
  ros__parameters:
    use_sim_time: true

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


behavior_server:
  ros__parameters:
    use_sim_time: true

    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: nav2_behaviors::Spin

    backup:
      plugin: nav2_behaviors::BackUp

    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading

    wait:
      plugin: nav2_behaviors::Wait

    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3


waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20
    stop_on_failure: false

    waypoint_task_executor_plugin: wait_at_waypoint

    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP

    max_velocity: [0.25, 0.0, 0.7]
    min_velocity: [-0.25, 0.0, -0.7]

    max_accel: [0.35, 0.0, 0.9]
    max_decel: [-0.35, 0.0, -0.9]

    odom_topic: /odom
    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0


collision_monitor:
  ros__parameters:
    use_sim_time: true

    base_frame_id: base_footprint
    odom_frame_id: odom

    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel

    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 1.0
    stop_pub_timeout: 2.0

    enable_stamped_cmd_vel: false

    polygons: ["SlowZone", "StopZone"]

    SlowZone:
      type: circle
      radius: 0.30
      action_type: slowdown
      slowdown_ratio: 0.45
      min_points: 3
      visualize: true
      polygon_pub_topic: slow_zone

    StopZone:
      type: circle
      radius: 0.12
      action_type: stop
      min_points: 5
      visualize: true
      polygon_pub_topic: stop_zone

    observation_sources: ["scan"]

    scan:
      type: scan
      topic: /scan
      min_height: 0.05
      max_height: 2.0
      enabled: true